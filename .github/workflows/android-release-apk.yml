name: android-release-apk

# 手动触发，产出可直接安装的 release APK（临时签名，不依赖仓库 secrets）。
# 与 android-debug-apk.yml 并存，互不影响：那条线继续出 debug 包，这条线只出 16KB 设备可用的 release 包。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Build release APK
        run: bash tools/build_release_apk.sh

      - name: Show APK info
        if: always()
        run: |
          APK=apps/flutter/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -lh "$APK" || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: operit2-release-apk
          path: apps/flutter/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30
