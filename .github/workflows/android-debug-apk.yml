# Operit2 Android Debug APK 自动构建（自用，不发行）
# - push 到 main 自动触发，也可在 Actions 页面手动触发
# - 产出免签名 debug APK（无需配置任何签名 secret）
# - 构建成功后自动发布到 GitHub Releases
#
# 关键前提（来自 apps/flutter/app/android/app/build.gradle.kts）：
#   Gradle 的 syncOperitPlugins / prepareOperitAndroidV8 任务硬编码调用
#   仓库根目录的 .venv Python（.venv/Scripts/python.exe），因此必须先建好
#   该虚拟环境，否则这两个任务失败。
#   不要手工跑 cargo check：它绕过 syncOperitPlugins，会触发
#   operit-runtime/build.rs 的插件资源断言而 panic。
name: android-debug-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-apk
  cancel-in-progress: true

env:
  RUSTFLAGS: -Awarnings
  RUST_TOOLCHAIN_VERSION: 1.95.0
  FVM_VERSION: 4.3.0

jobs:
  # 阶段一：在 Linux 上编译 Android 终端运行时（rootfs + 原生 .so）
  build-android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison build-essential bzip2 ca-certificates curl diffutils flex \
            gawk gzip patch pkg-config tar unzip xz-utils

      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 1

  # 阶段二：在 Windows 上组装 debug APK（免签名）
  build-android:
    needs: build-android-runtime
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      OPERIT_LIBCLANG_DIR: ${{ github.workspace }}\target\operit-build-tools\libclang.runtime.win-x64.21.1.8\runtimes\win-x64\native
      ANDROID_SDK_ROOT: C:\Program Files (x86)\Android\android-sdk
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android terminal runtime
        uses: actions/download-artifact@v4
        with:
          name: operit2-android-runtime-${{ github.sha }}
          path: apps/flutter/app/android/app/src/main

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Gradle 硬编码 .venv/Scripts/python.exe，必须先创建。
      - name: Create .venv for Gradle plugin sync
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip --quiet
          if (-not (Test-Path .\.venv\Scripts\python.exe)) {
            throw "Gradle expects .venv/Scripts/python.exe"
          }

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Prepare Android bindgen libclang
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Install workflow plugin dependencies
        shell: pwsh
        run: |
          corepack enable
          Push-Location plugins/packages/buildin/workflow
          corepack pnpm install --frozen-lockfile
          Pop-Location

      # sync_plugin_packages.py 硬性要求仓库托管的 tsc，
      # 缺失时报 "TypeScript compiler not found"。
      - name: Install repository-managed TypeScript
        shell: pwsh
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          $tsc = ".ci-tools/typescript/node_modules/.bin/tsc.cmd"
          if (-not (Test-Path $tsc)) { throw "tsc not installed at $tsc" }
          & $tsc --version

      # Flutter 侧 lib/core/proxy/generated/*.g.dart 由该 crate 的 build.rs
      # 调用 operit-proxy-dart-codegen 生成，不生成则 flutter 编译报
      # "Error when reading CoreProxyClients.g.dart"。
      # 先同步插件资源：cargo check 会编译 operit-runtime，其 build.rs 断言
      # 插件资源与 plugins/packages 一致，未同步会 panic。
      - name: Sync plugin packages
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe plugins\tools\sync_plugin_packages.py --source runtime --no-hot-reload

      - name: Generate Dart proxy codegen
        shell: pwsh
        run: |
          cargo check --manifest-path core/crates/proxy/local/Cargo.toml
          $gen = "apps/flutter/app/lib/core/proxy/generated"
          if (-not (Test-Path $gen)) { throw "Dart proxy codegen did not produce $gen" }
          Get-ChildItem $gen | Select-Object -First 10 Name

      # V8 源码编译是最贵的一步，缓存 Rust bridge 与构建工具。
      - name: Cache Rust bridge target
        uses: actions/cache@v4
        with:
          path: |
            apps/flutter/native/operit-flutter-bridge/target
            target/operit-build-tools
          key: rust-bridge-${{ runner.os }}-${{ hashFiles('apps/flutter/native/operit-flutter-bridge/Cargo.lock', 'tools/build_scripts/prepare_android_v8.py') }}
          restore-keys: rust-bridge-${{ runner.os }}-

      # NDK 现场下载安装实测吃掉 8 分钟里的大头，单独缓存。
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}\ndk\28.2.13676358
          key: ndk-28.2.13676358-${{ runner.os }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/flutter/app/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # 放开 Gradle 并行与构建缓存，缩短重复构建。
      - name: Tune Gradle for CI
        shell: pwsh
        run: |
          $f = "apps/flutter/app/android/gradle.properties"
          if (-not (Test-Path $f)) { New-Item -ItemType File -Force -Path $f | Out-Null }
          Add-Content -Path $f -Encoding utf8 -Value @(
            "org.gradle.parallel=true",
            "org.gradle.caching=true",
            "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m"
          )

      # build.gradle.kts 在配置阶段就无条件创建 release signingConfig 并读取
      # 4 个属性，缺任何一个都会抛 "Missing Android release signing property"，
      # 哪怕构建的是 debug 变体。这里生成一次性自签名 keystore 填进去，
      # 让配置阶段通过；debug 变体实际不会用它（只有 release 绑定了 signingConfig）。
      - name: Provision throwaway signing properties
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE ".tmp"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $store = Join-Path $dir "debug-only.keystore"
          & "$env:JAVA_HOME\bin\keytool.exe" -genkeypair -v `
            -keystore "$store" -storetype PKCS12 `
            -alias operitdebug -keyalg RSA -keysize 2048 -validity 10000 `
            -storepass android -keypass android `
            -dname "CN=Operit Debug Only, O=Local, C=CN"
          if (-not (Test-Path $store)) { throw "keytool did not create $store" }
          # Windows 路径写进 .properties 需转成正斜杠，避免反斜杠被当转义符。
          $storePosix = $store.Replace('\', '/')
          $propsFile = "apps/flutter/app/android/local.properties"
          if (-not (Test-Path $propsFile)) {
            New-Item -ItemType File -Force -Path $propsFile | Out-Null
          }
          # 只追加这 4 行，不覆盖文件里其它键（如 flutter.sdk）。
          Add-Content -Path $propsFile -Encoding utf8 -Value @(
            "RELEASE_STORE_FILE=$storePosix",
            "RELEASE_STORE_PASSWORD=android",
            "RELEASE_KEY_ALIAS=operitdebug",
            "RELEASE_KEY_PASSWORD=android"
          )
          Get-Content $propsFile

      # Gradle 会自动串起 syncOperitPlugins → prepareOperitAndroidV8 →
      # cargo build → 打包。
      - name: Build debug APK
        working-directory: apps/flutter/app
        shell: pwsh
        run: |
          fvm flutter build apk --debug --split-per-abi --target-platform android-arm64
          if ($LASTEXITCODE -ne 0) { throw "flutter build apk failed" }

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-debug-${{ github.sha }}
          path: apps/flutter/app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish debug APK to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="debug-$(date -u +%Y%m%d-%H%M)"
          APK="apps/flutter/app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          gh release create "$TAG" \
            --title "Android Debug APK $TAG" \
            --notes "自动构建的免签名 debug APK（arm64-v8a）。源码 @ $SHORT_SHA" \
            --target main
          gh release upload "$TAG" "$APK"