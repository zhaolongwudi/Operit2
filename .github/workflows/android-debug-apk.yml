# Operit2 Android Debug APK 自动构建（自用，不发行）
#
# 为什么跑在 Linux 而不是 Windows：
#   Operit2 的 Rust bridge 依赖 rusty_v8，V8 没有 Android 预编译产物，
#   只能源码构建；而 V8 的 gn 配置里硬性断言
#     assert(host_os == "linux", "Android builds are only supported on Linux.")
#   因此在 Windows runner 上必然失败。上游 android-flutter-build.yml 用
#   windows-2025，那条流水线本身也跑不通。
#
# 产物：免签名 debug APK，发布到 GitHub Releases。
name: android-debug-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-apk
  cancel-in-progress: true

env:
  RUSTFLAGS: -Awarnings
  RUST_TOOLCHAIN_VERSION: 1.95.0
  FVM_VERSION: 4.3.0
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_VERSION: 28.2.13676358
  PYTHONUTF8: 1
  PYTHONIOENCODING: utf-8

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # V8 源码构建占用空间极大，Ubuntu runner 默认盘不够用。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison build-essential bzip2 ca-certificates curl diffutils flex \
            gawk gzip patch pkg-config tar unzip xz-utils libssl-dev

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      # Gradle 的 build.gradle.kts 在非 Windows 上把 libclang 目录硬编码为
      # /usr/lib，且 V8 / rust bridge 的 bindgen 需要 libclang 21+。
      - name: Install LLVM 21 and lld
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev libclang-21-dev lld-21
          # build.gradle.kts 预期 /usr/lib/libclang.so。
          sudo ln -sf /usr/lib/llvm-21/lib/libclang.so /usr/lib/libclang.so
          sudo ln -sf /usr/lib/llvm-21/lib/libclang.so.1 /usr/lib/libclang.so.1 || true
          ls -l /usr/lib/libclang.so
          clang-21 --version || true

      - name: Install Android NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          ls "$ANDROID_HOME/ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Install FVM
        run: |
          dart pub global activate fvm "$FVM_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        run: fvm install --skip-pub-get

      # Gradle 的 syncOperitPlugins / prepareOperitAndroidV8 任务硬编码调用
      # 仓库根目录的 .venv Python。
      - name: Create .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip --quiet
          test -x .venv/bin/python

      - name: Install workflow plugin dependencies
        run: |
          corepack enable
          pushd plugins/packages/buildin/workflow
          corepack pnpm install --frozen-lockfile
          popd

      # sync_plugin_packages.py 硬性要求仓库托管的 tsc。
      - name: Install repository-managed TypeScript
        run: |
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          test -f .ci-tools/typescript/node_modules/.bin/tsc
          .ci-tools/typescript/node_modules/.bin/tsc --version

      - name: Cache Rust and V8 artifacts
        uses: actions/cache@v4
        with:
          path: |
            core/target
            apps/flutter/native/operit-flutter-bridge/target
            tools/release/work/android-v8
          key: rust-v8-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock', 'tools/build_scripts/prepare_android_v8.py') }}
          restore-keys: rust-v8-${{ runner.os }}-

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: |
            apps/flutter/app/.fvm/flutter_sdk
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('apps/flutter/app/.fvmrc') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/flutter/app/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # 终端运行时（bash / busybox / proot / loader + Alpine rootfs）
      - name: Fetch Android runtime sources
        shell: pwsh
        run: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android runtime NDK
        run: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      # cargo 会编译 operit-runtime，其 build.rs 断言插件资源已同步。
      - name: Sync plugin packages
        run: .venv/bin/python plugins/tools/sync_plugin_packages.py --source runtime --no-hot-reload

      # Flutter 侧 lib/core/proxy/generated/*.g.dart 由该 crate 的 build.rs
      # 调用 operit-proxy-dart-codegen 生成，缺失则 flutter 编译报错。
      - name: Generate Dart proxy codegen
        run: |
          cargo check --manifest-path core/crates/proxy/local/Cargo.toml
          test -d apps/flutter/app/lib/core/proxy/generated

      # build.gradle.kts 在配置阶段就无条件创建 release signingConfig 并读取
      # 4 个属性，缺任一即抛 GradleException，哪怕构建 debug 变体。
      # 生成一次性自签名 keystore 让它通过；debug 实际不使用。
      - name: Provision throwaway signing properties
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/.tmp/debug-only.keystore" \
            -storetype PKCS12 \
            -alias operitdebug -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Operit Debug Only, O=Local, C=CN"
          PROPS="apps/flutter/app/android/local.properties"
          mkdir -p "$(dirname "$PROPS")"
          touch "$PROPS"
          {
            echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/.tmp/debug-only.keystore"
            echo "RELEASE_STORE_PASSWORD=android"
            echo "RELEASE_KEY_ALIAS=operitdebug"
            echo "RELEASE_KEY_PASSWORD=android"
          } >> "$PROPS"
          cat "$PROPS"

      - name: Build debug APK
        working-directory: apps/flutter/app
        run: |
          fvm flutter build apk --debug --split-per-abi --target-platform android-arm64 2>&1 | tee /tmp/build.log
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: operit2-android-debug-${{ github.sha }}
          path: apps/flutter/app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish debug APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="debug-$(date -u +%Y%m%d-%H%M)"
          APK="apps/flutter/app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          gh release create "$TAG" \
            --title "Android Debug APK $TAG" \
            --notes "自动构建的免签名 debug APK（arm64-v8a）。源码 @ $SHORT_SHA" \
            --target main
          gh release upload "$TAG" "$APK"