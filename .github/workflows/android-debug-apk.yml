name: android-debug-apk

# 自用 debug APK：main 上每次 push 构建一次，也可手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5
      - name: Build debug APK
        run: bash tools/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: operit2-debug-apk
          path: apps/flutter/app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
